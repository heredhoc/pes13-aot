name: AOT PES13 medir (muestras)

on:
  workflow_dispatch:
    inputs:
      pcts:
        description: 'Porcentajes de funciones a conservar (separados por espacio)'
        required: false
        default: '2 4 8'
      extra_flags:
        description: 'Flags extra para wamrc'
        required: false
        default: "--enable-indirect-mode --disable-llvm-intrinsics --disable-llvm-lto --enable-llvm-passes='function(mem2reg,instcombine<no-verify-fixpoint>,simplifycfg)'"
      wasm_url:
        description: 'URL del wasm.br'
        required: false
        default: 'https://pes13.optijuegos.net/assets/pes13.wasm.br'
      wamr_tag:
        description: 'Tag de WAMR'
        required: false
        default: 'WAMR-2.4.5'
      llvm_version:
        description: 'Version de LLVM de apt'
        required: false
        default: '18'

jobs:
  aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Info del runner
        run: |
          nproc
          free -h
          df -h .

      - name: Liberar disco y agregar swap grande
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift || true
          AV=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          SZ=$(( ${AV:-0} - 8 ))
          if [ "$SZ" -gt 50 ]; then SZ=50; fi
          if [ "$SZ" -ge 8 ]; then
            sudo fallocate -l ${SZ}G /swapfile2
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          fi
          df -h /
          free -h
          swapon --show

      - name: Instalar dependencias
        run: |
          V="${{ inputs.llvm_version }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "llvm-${V}-dev" cmake ninja-build build-essential \
            zlib1g-dev libzstd-dev libedit-dev libxml2-dev wabt brotli

      - name: Bajar y descomprimir wasm
        run: |
          curl -fsSL -o pes13.wasm.br "${{ inputs.wasm_url }}"
          brotli -df pes13.wasm.br -o pes13.wasm
          ls -l pes13.wasm.br pes13.wasm
          head -c 8 pes13.wasm | od -An -tx1
          sha256sum pes13.wasm
          [ "$(stat -c %s pes13.wasm)" = 89614031 ] || echo "AVISO: tamano distinto al analizado (89614031)"
          python3 patch_eh.py pes13.wasm pes13_noeh.wasm
          ls -l pes13_noeh.wasm
          sha256sum pes13_noeh.wasm
          echo "WASM=pes13_noeh.wasm" >> "$GITHUB_ENV"

      - name: Clonar WAMR y aplicar parche SIMD
        run: |
          git clone --depth 1 --branch "${{ inputs.wamr_tag }}" \
            https://github.com/bytecodealliance/wasm-micro-runtime wamr
          F=wamr/core/iwasm/compilation/simd/simd_conversions.c
          for n in 166 168; do
            sed -n "${n}p" "$F" | grep -q 'simd_saturate(comp_ctx, func_ctx, e_sat_i16x8' \
              || { echo "La linea $n no es la esperada:"; sed -n "${n}p" "$F"; exit 1; }
          done
          sed -i '166s/e_sat_i16x8/itype/;168s/e_sat_i16x8/itype/' "$F"

      - name: Compilar wamrc
        run: |
          V="${{ inputs.llvm_version }}"
          mkdir -p wamr/core/deps/llvm/build
          cmake -S wamr/wamr-compiler -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="/usr/lib/llvm-${V}/lib/cmake/llvm"
          cmake --build build -j2
          ls -l build/wamrc
          echo "WAMRC=$PWD/build/wamrc" >> "$GITHUB_ENV"
          "$PWD/build/wamrc" --help > wamrc_help.txt 2>&1 || true

      - name: Medir muestras
        run: |
          : > medir.txt
          for P in ${{ inputs.pcts }}; do
            python3 trim_wasm.py pes13_noeh.wasm muestra_$P.wasm $P | tee -a medir.txt
            rm -f mem_$P.log
            ( while true; do
                PID=$(pgrep -x wamrc | head -1)
                [ -n "$PID" ] && echo "$(date +%T) $(grep -E 'VmPeak|VmHWM|VmSwap' /proc/$PID/status | tr -s ' ' | tr '\n' ' ')" >> mem_$P.log
                sleep 10
              done ) &
            MP=$!
            set +e
            timeout 40m /usr/bin/time -v -o time_$P.txt \
              "$WAMRC" --target=aarch64 --opt-level=0 ${{ inputs.extra_flags }} \
              -o muestra_$P.aot muestra_$P.wasm > wamrc_$P.log 2>&1
            RC=$?
            set -e
            kill $MP 2>/dev/null || true
            {
              echo "--- pct=$P rc=$RC"
              grep -E "Elapsed|Maximum resident" time_$P.txt || true
              tail -1 mem_$P.log || true
              ls -l muestra_$P.aot 2>/dev/null || echo "sin .aot"
              grep -ciE 'error|fail|unsupported' wamrc_$P.log | sed 's/^/lineas error: /'
              grep -iE 'error|fail|unsupported' wamrc_$P.log | head -5 || true
            } | tee -a medir.txt
            rm -f muestra_$P.aot muestra_$P.wasm
            free -m | sed -n 2,3p | tee -a medir.txt
          done
          cat medir.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medir-pes13
          path: |
            medir.txt
            time_*.txt
            mem_*.log
            wamrc_*.log
            wamrc_help.txt
          retention-days: 5
          if-no-files-found: ignore
